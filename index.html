<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Protocolos</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="app">

        <!-- =========================
             SIDEBAR
        ========================== -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <div class="logo">
                    <span>📋</span>
                    <strong>PROTOCOLOS</strong>
                </div>
            </div>

            <!-- Pesquisa -->
            <div class="sidebar-search">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Pesquisar protocolos..."
                >
            </div>

            <!-- Categorias -->
            <div class="categories-header">
                <span>CATEGORIAS</span>

                <button
                    class="icon-button"
                    id="newCategoryButton"
                    title="Nova categoria"
                >
                    +
                </button>
            </div>

            <nav id="categoryList" class="category-list">
                <!-- Categorias inseridas pelo JavaScript -->
            </nav>

        </aside>


        <!-- =========================
             CONTEÚDO PRINCIPAL
        ========================== -->
        <main class="main-content">

            <!-- Cabeçalho -->
            <header class="topbar">

                <div>
                    <h1>Meus Protocolos</h1>

                    <p>
                        Selecione um protocolo ou crie um novo para começar.
                    </p>
                </div>

                <button
                    class="primary-button"
                    id="newProtocolButton"
                >
                    + Criar protocolo
                </button>

            </header>


            <!-- Barra de informações -->
            <section class="content-toolbar">

                <div>
                    <strong id="protocolCount">0</strong>
                    <span>protocolos</span>
                </div>

                <div id="currentCategoryName">
                    Todos os protocolos
                </div>

            </section>


            <!-- Lista de protocolos -->
            <section
                id="protocolList"
                class="protocol-list"
            >
                <!-- Protocolos inseridos pelo JavaScript -->
            </section>

        </main>

    </div>


    <!-- =====================================================
         MODAL - PROTOCOLO
    ====================================================== -->

    <div
        id="protocolModal"
        class="modal hidden"
    >

        <div class="modal-overlay"></div>

        <div class="modal-box">

            <div class="modal-header">

                <div>
                    <h2 id="protocolModalTitle">
                        Novo protocolo
                    </h2>

                    <p>
                        Preencha as informações abaixo.
                    </p>
                </div>

                <button
                    class="close-button"
                    id="closeProtocolModal"
                >
                    ×
                </button>

            </div>


            <form id="protocolForm">

                <input
                    type="hidden"
                    id="protocolId"
                >


                <div class="form-group">

                    <label for="protocolName">
                        Nome do protocolo
                    </label>

                    <input
                        type="text"
                        id="protocolName"
                        placeholder="Ex.: ALTERAÇÃO DE SENHA"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="protocolCategory">
                        Categoria
                    </label>

                    <select
                        id="protocolCategory"
                        required
                    >
                    </select>

                </div>


                <div class="form-group">

                    <label for="protocolText">
                        Texto do protocolo
                    </label>

                    <textarea
                        id="protocolText"
                        rows="10"
                        placeholder="Digite aqui o texto que será utilizado no atendimento..."
                        required
                    ></textarea>

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="secondary-button"
                        id="cancelProtocolButton"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Salvar protocolo
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         MODAL - CATEGORIA
    ====================================================== -->

    <div
        id="categoryModal"
        class="modal hidden"
    >

        <div class="modal-overlay"></div>

        <div class="modal-box modal-small">

            <div class="modal-header">

                <div>
                    <h2 id="categoryModalTitle">
                        Nova categoria
                    </h2>

                    <p>
                        Crie uma categoria para organizar seus protocolos.
                    </p>
                </div>

                <button
                    class="close-button"
                    id="closeCategoryModal"
                >
                    ×
                </button>

            </div>


            <form id="categoryForm">

                <input
                    type="hidden"
                    id="categoryId"
                >


                <div class="form-group">

                    <label for="categoryName">
                        Nome da categoria
                    </label>

                    <input
                        type="text"
                        id="categoryName"
                        placeholder="Ex.: INTERNET"
                        required
                    >

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="secondary-button"
                        id="cancelCategoryButton"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Salvar categoria
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Toast / mensagens -->
    <div
        id="toast"
        class="toast"
    ></div>

   <script src="script.js"></script>


</body>
</html>
